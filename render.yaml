# StaffBro on Render: API (Docker) + admin SPA + Postgres.
# Dashboard → New → Blueprint → connect this GitHub repo (file at repo root).
#
# Free web services sleep after ~15 minutes idle. Free Postgres expires after 30 days.
# Expo is not hosted here — set EXPO_PUBLIC_API_URL to the API https://…onrender.com URL.

databases:
  - name: staffbro-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: staffbro
    user: staffbro
    region: singapore

services:
  - type: web
    name: staffbro-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_VERSION
        value: "0.2.0"
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: staffbro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_TASKS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: staffbro-admin
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: staffbro-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: ./admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: staffbro-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
